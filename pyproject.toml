[project]
name = "bambusa"
version = "0.1.0"
description = "Toy Bambusa runtime and debugger"
authors = [{name = "Bambusa Contributors"}]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bambusa = "bambusa.cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
